[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dax-day-research-lab"
version = "0.1.0"
description = "Deterministic DAX research, reference, and DAX-BOT runtime toolkit with frozen REF-V11.2 baseline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "psycopg[binary]>=3.2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff==0.16.2",
]
statistics = [
  "arch>=8.0,<9",
]
data = [
  "pyarrow>=18,<27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
