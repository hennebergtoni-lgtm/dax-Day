name: windows-host-lane-ci

on:
  pull_request:

jobs:
  windows-host-lane:
    name: windows-host-lane-ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install broker-free test surface
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest ruff==0.16.2 tzdata numpy hypothesis
      - name: Install actual browser acceptance dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bot-helper-browser" --no-save --package-lock=false playwright
          "$RUNNER_TEMP/bot-helper-browser/node_modules/.bin/playwright" install chromium
      - name: Bot Helper V1 first acceptance pass
        shell: bash
        env:
          BOT_HELPER_REQUIRE_BROWSER: '1'
          NODE_PATH: ${{ runner.temp }}/bot-helper-browser/node_modules
        run: python scripts/run_bot_helper_acceptance.py --output-dir bot-helper-acceptance --pass-name pass1
      - name: Bot Helper V1 independent second acceptance pass
        if: always()
        shell: bash
        env:
          BOT_HELPER_REQUIRE_BROWSER: '1'
          NODE_PATH: ${{ runner.temp }}/bot-helper-browser/node_modules
        run: python scripts/run_bot_helper_acceptance.py --output-dir bot-helper-acceptance --pass-name pass2
      - name: Turbo first acceptance pass including native file persistence
        run: python scripts/run_turbo_acceptance.py --output-dir turbo-acceptance --pass-name pass1
      - name: Turbo fresh-process second acceptance pass
        if: always()
        run: python scripts/run_turbo_acceptance.py --output-dir turbo-acceptance --pass-name pass2
      - name: PowerShell parser parity
        shell: powershell
        run: |
          foreach ($path in @(
              'scripts/run_ig_predemo_readiness_2238.ps1',
              'scripts/dax_windows_host_lane.psm1',
              'tests/powershell/dax_windows_module_import_contract.ps1',
              'tests/powershell/dax_windows_host_lane_failure_injection.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              foreach ($parseError in $errors) {
                Write-Host ('PARSER_ITEM: path={0}; error_id={1}; line={2}' -f
                  $path, $parseError.ErrorId, $parseError.Extent.StartLineNumber)
              }
              throw ('WINDOWS_HOST_LANE_SYNTAX_INVALID:' + $path)
            }
          }
      - name: Windows PowerShell 5.1 exact module import contract
        shell: powershell
        run: tests/powershell/dax_windows_module_import_contract.ps1
      - name: Windows PowerShell 5.1 failure matrix
        shell: powershell
        run: tests/powershell/dax_windows_host_lane_failure_injection.ps1
      - name: PowerShell 7 compatibility
        shell: pwsh
        run: |
          tests/powershell/dax_windows_module_import_contract.ps1
          tests/powershell/dax_windows_host_lane_failure_injection.ps1
      - name: Windows path, import, output and aggregate preflight tests
        run: >-
          pytest -q
          tests/test_dax_windows_host_preflight.py
          tests/test_dax_windows_python_runtime_probe.py
          tests/test_ig_rest_readonly.py
          tests/test_ig_rest_readonly_inventory.py
          tests/test_run_ig_predemo_readiness_2238.py
      - name: Host-lane Ruff and syntax
        run: |
          ruff check src/daxlab/adapters/ig_rest_readonly.py scripts/dax_windows_host_preflight.py scripts/dax_windows_python_runtime_probe.py scripts/ig_demo_credential_contract.py scripts/run_ig_predemo_readiness_2238.py tests/test_dax_windows_host_preflight.py tests/test_dax_windows_python_runtime_probe.py tests/test_ig_rest_readonly.py tests/test_ig_rest_readonly_inventory.py tests/test_run_ig_predemo_readiness_2238.py
          python -m py_compile src/daxlab/adapters/ig_rest_readonly.py scripts/dax_windows_host_preflight.py scripts/dax_windows_python_runtime_probe.py scripts/ig_demo_credential_contract.py scripts/run_ig_predemo_readiness_2238.py
      - name: Retain sanitized Bot Helper acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-helper-v1-windows-host-lane-ci-${{ github.sha }}
          path: bot-helper-acceptance/
          retention-days: 30
          if-no-files-found: error
      - name: Retain sanitized Turbo Windows evidence and lessons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-v1-1-windows-${{ github.sha }}
          path: turbo-acceptance/
          retention-days: 30
          if-no-files-found: error
