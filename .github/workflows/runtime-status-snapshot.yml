name: runtime-status-snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/runtime-status-snapshot.yml'
      - 'scripts/build_runtime_status_snapshot.py'

permissions:
  contents: write

concurrency:
  group: runtime-status-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database client
        run: pip install 'psycopg[binary]>=3.2'
      - name: Build read-only runtime snapshot
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/build_runtime_status_snapshot.py
      - name: Validate fail-closed snapshot safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('web/runtime_status.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version'] == 'DAXLAB_MT5_SHADOW_RUNTIME_STATUS_V1'
          assert data['mode'] == 'SHADOW'
          assert data['read_only'] is True
          assert data['monitoring_only'] is True
          assert data['execution_capability'] == 'NONE'
          assert data['order_execution_enabled'] is False
          hb = data.get('heartbeat')
          if hb is not None:
              assert hb['execution_capability'] == 'NONE'
              assert hb['order_execution_enabled'] is False
          print('Runtime snapshot safety OK')
          PY
      - name: Commit snapshot when changed
        run: |
          if [ -z "$(git status --porcelain -- web/runtime_status.json)" ]; then
            echo 'Runtime snapshot unchanged; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/runtime_status.json
          git commit -m 'Update MT5 SHADOW runtime status snapshot'
          git push origin HEAD:main
