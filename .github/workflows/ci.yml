name: research-lab-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: pytest
      - name: Recovery reconstruction preflight
        run: python scripts/recovery_preflight.py
      - name: Research registry integrity
        run: python scripts/check_research_registry.py
      - name: Hypothesis ledger integrity
        run: python scripts/check_hypothesis_ledger.py
      - name: Web status integrity
        run: python scripts/check_web_status.py
      - name: V11 pre-host hardening smoke
        run: python scripts/v11_prehost_smoke.py
      - name: V11.2 engine surface probe
        run: python scripts/probe_v112_engine.py
      - name: Guarded V11.2 replay smoke
        run: python scripts/v112_replay_smoke.py
      - name: Offline SHADOW soak smoke
        run: python scripts/shadow_soak_smoke.py
      - name: Neon connection gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/check_neon.py
      - name: Apply research database migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/migrate_db.py
      - name: Neon integrity gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/check_db_integrity.py
      - name: Isolated database restore drill
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/db_restore_drill.py
      - name: Isolated detail import drill
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/detail_import_db_drill.py
