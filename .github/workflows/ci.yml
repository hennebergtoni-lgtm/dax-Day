name: research-lab-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: research-lab-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev,statistics,data]'
      - name: Install actual browser acceptance dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bot-helper-browser" --no-save --package-lock=false playwright
          "$RUNNER_TEMP/bot-helper-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Bot Helper V1 first acceptance pass
        shell: bash
        env:
          BOT_HELPER_REQUIRE_BROWSER: '1'
          NODE_PATH: ${{ runner.temp }}/bot-helper-browser/node_modules
        run: python scripts/run_bot_helper_acceptance.py --output-dir bot-helper-acceptance --pass-name pass1
      - name: Bot Helper V1 independent second acceptance pass
        if: always()
        shell: bash
        env:
          BOT_HELPER_REQUIRE_BROWSER: '1'
          NODE_PATH: ${{ runner.temp }}/bot-helper-browser/node_modules
        run: python scripts/run_bot_helper_acceptance.py --output-dir bot-helper-acceptance --pass-name pass2
      - name: Ruff
        run: ruff check src tests scripts
      - name: Turbo V1.1 U01-U40 first acceptance pass
        run: python scripts/run_turbo_acceptance.py --output-dir turbo-acceptance --pass-name pass1
      - name: Turbo V1.1 independent second acceptance pass
        if: always()
        run: python scripts/run_turbo_acceptance.py --output-dir turbo-acceptance --pass-name pass2
      - name: Step 2233/2237 and pre-DEMO IG regressions and Python syntax
        run: |
          pytest tests/test_export_ig_raw_truth_2233.py tests/test_export_ig_raw_truth_2233_runner.py tests/test_run_ig_raw_truth_2233.py tests/test_ig_raw_m5_timestamp_diagnostic.py tests/test_ig_market_data.py tests/test_ig_demo_readonly_probe.py tests/test_ig_cand001_shadow_e2e.py tests/test_run_ig_m5_contract_2237.py tests/test_ig_rest_readonly.py tests/test_ig_session_owner.py tests/test_ig_predemo_safety.py tests/test_dax_windows_host_preflight.py tests/test_dax_windows_python_runtime_probe.py tests/test_run_ig_predemo_readiness_2238.py
          python -m py_compile scripts/export_ig_raw_truth_2233.py scripts/run_ig_raw_truth_2233.py scripts/ig_raw_m5_timestamp_diagnostic.py scripts/ig_demo_credential_contract.py scripts/ig_demo_readonly_probe.py scripts/ig_cand001_shadow_e2e.py scripts/run_ig_m5_contract_2237.py scripts/dax_windows_host_preflight.py scripts/dax_windows_python_runtime_probe.py scripts/run_ig_predemo_readiness_2238.py src/daxlab/adapters/ig_market_data.py src/daxlab/runtime/atomic_json.py src/daxlab/adapters/ig_rest_readonly.py src/daxlab/runtime/ig_predemo_safety.py
      - name: Research Factory source and owner integrity
        run: python scripts/check_acceleration_program.py
      - name: Dependent cash risk and drawdown research regressions
        run: pytest tests/test_fixed_cash_tail_research.py tests/test_boost001.py tests/test_historical_risk_envelope.py
      - name: Full identity and observed execution attribution regressions
        run: pytest tests/test_acceleration_evidence_analytics.py
      - name: Independent PTC and protection safety regressions
        run: pytest tests/test_independent_pretrade_controls.py tests/test_broker_execution_protection.py tests/test_nextgen_execution_protection_binding.py
      - name: Causal regime research regressions
        run: pytest tests/test_causal_hysteresis_regime.py tests/test_atr_regime.py
      - name: Export runner PowerShell syntax (not Windows runtime evidence)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/export_ig_raw_truth_2233.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'EXPORT_RUNNER_SYNTAX_INVALID' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/run_ig_m5_contract_2237.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'CONTRACT_RUNNER_SYNTAX_INVALID' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/run_ig_predemo_readiness_2238.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'PREDEMO_RUNNER_SYNTAX_INVALID' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/dax_windows_host_lane.psm1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'WINDOWS_HOST_LANE_OWNER_SYNTAX_INVALID' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tests/powershell/dax_windows_host_lane_failure_injection.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'WINDOWS_HOST_LANE_INJECTION_SYNTAX_INVALID' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tests/powershell/dax_windows_module_import_contract.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'WINDOWS_MODULE_IMPORT_CONTRACT_SYNTAX_INVALID' }
      - name: Windows host lane PowerShell failure injection
        shell: pwsh
        run: |
          tests/powershell/dax_windows_module_import_contract.ps1
          tests/powershell/dax_windows_host_lane_failure_injection.ps1
      - name: Export runner fixed fail-closed code contract
        shell: bash
        run: |
          set +e
          result="$(pwsh -NoProfile -File scripts/export_ig_raw_truth_2233.ps1 -ExpectedHead invalid 2>&1)"
          child_exit=$?
          set -e
          test "$child_exit" -eq 2
          grep -q 'error_code=HEAD_INVALID' <<< "$result"
          set +e
          result="$(pwsh -NoProfile -File scripts/export_ig_raw_truth_2233.ps1 -ExpectedHead aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -RepoRoot definitely-missing-export-root 2>&1)"
          child_exit=$?
          set -e
          test "$child_exit" -eq 2
          grep -q 'error_code=HOST_UNAVAILABLE' <<< "$result"
          set +e
          result="$(pwsh -NoProfile -File scripts/run_ig_predemo_readiness_2238.ps1 -ExpectedHead invalid 2>&1)"
          child_exit=$?
          set -e
          test "$child_exit" -eq 2
          grep -q 'error_code=HEAD_INVALID' <<< "$result"
          set +e
          result="$(pwsh -NoProfile -File scripts/run_ig_predemo_readiness_2238.ps1 -ExpectedHead aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -RepoRoot definitely-missing-predemo-root 2>&1)"
          child_exit=$?
          set -e
          test "$child_exit" -eq 2
          grep -q 'error_code=HOST_UNAVAILABLE' <<< "$result"
          set +e
          result="$(pwsh -NoProfile -File scripts/run_ig_m5_contract_2237.ps1 -ExpectedHead invalid 2>&1)"
          child_exit=$?
          set -e
          test "$child_exit" -eq 2
          grep -q 'error_code=HEAD_INVALID' <<< "$result"
          set +e
          result="$(pwsh -NoProfile -File scripts/run_ig_m5_contract_2237.ps1 -ExpectedHead aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -RepoRoot definitely-missing-contract-root 2>&1)"
          child_exit=$?
          set -e
          test "$child_exit" -eq 2
          grep -q 'error_code=HOST_UNAVAILABLE' <<< "$result"
      - name: Tests
        run: pytest
      - name: Recovery reconstruction preflight
        run: python scripts/recovery_preflight.py
      - name: Research registry integrity
        run: python scripts/check_research_registry.py
      - name: Hypothesis ledger integrity
        run: python scripts/check_hypothesis_ledger.py
      - name: Web status integrity
        run: python scripts/check_web_status.py
      - name: Static read-only runtime safety smoke
        run: python scripts/static_runtime_safety_smoke.py
      - name: V11.2 engine surface probe
        run: python scripts/probe_v112_engine.py
      - name: Guarded V11.2 replay smoke
        run: python scripts/v112_replay_smoke.py
      - name: Offline SHADOW soak smoke
        run: python scripts/shadow_soak_smoke.py
      - name: Neon connection gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/check_neon.py
      - name: Apply research database migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/migrate_db.py
      - name: Neon integrity gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/check_db_integrity.py
      - name: Isolated database restore drill
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/db_restore_drill.py
      - name: Isolated detail import drill
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/detail_import_db_drill.py
      - name: Retain sanitized Bot Helper acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-helper-v1-ci-${{ github.sha }}
          path: bot-helper-acceptance/
          retention-days: 30
          if-no-files-found: error
      - name: Retain sanitized Turbo evidence and lessons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-v1-1-ci-${{ github.sha }}
          path: turbo-acceptance/
          retention-days: 30
          if-no-files-found: error
